name: Deploy Lenra API

on:
  push:
    branches:
      - main

# Push image to GHCR; server pulls by tag (no scp tarballs / docker load).
permissions:
  contents: read
  packages: write

env:
  CONTAINER_NAME: lenra-api
  REGISTRY: ghcr.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve GHCR image name
        id: image
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "ref=${REGISTRY}/${owner}/${CONTAINER_NAME}" >> "$GITHUB_ENV"
          echo "GHCR image: ${REGISTRY}/${owner}/${CONTAINER_NAME}:${{ github.sha }}"

      - name: Log in to GHCR (push)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build -t "${IMAGE_REF}:${{ github.sha }}" .
          docker push "${IMAGE_REF}:${{ github.sha }}"
          docker tag "${IMAGE_REF}:${{ github.sha }}" "${IMAGE_REF}:latest"
          docker push "${IMAGE_REF}:latest"

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add deploy host to known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Free disk on deploy host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -s" <<EOF
          set -euo pipefail
          CONTAINER="${CONTAINER_NAME}"
          IMAGE_REF="${IMAGE_REF}"

          echo "=== Disk before cleanup ==="
          df -h /
          docker system df || true

          # Legacy scp deploy artifacts
          rm -f /home/ubuntu/deploy-staging/\${CONTAINER}.tar.gz 2>/dev/null || true
          rm -f /home/ubuntu/deploy-staging/\${CONTAINER}*.tar.gz 2>/dev/null || true

          docker stop "\${CONTAINER}-old" 2>/dev/null || true
          docker rm -f "\${CONTAINER}-old" 2>/dev/null || true

          if docker inspect "\${CONTAINER}" >/dev/null 2>&1; then
            KEEP=\$(docker inspect -f '{{.Image}}' "\${CONTAINER}")
            for repo in "\${IMAGE_REF}" "\${CONTAINER}"; do
              docker images "\${repo}" --no-trunc --format '{{.ID}}' 2>/dev/null | sort -u | while read -r id; do
                if [ "\$id" != "\$KEEP" ]; then
                  docker rmi -f "\$id" 2>/dev/null || true
                fi
              done
            done
          fi

          docker container prune -f || true
          docker image prune -af || true
          docker builder prune -af 2>/dev/null || true

          echo "=== Disk after cleanup ==="
          df -h /
          docker system df || true
          EOF

      - name: Deploy on server (docker pull)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_DEPLOY_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
          GHCR_USER: ${{ steps.image.outputs.owner }}
        run: |
          if [ -z "${GHCR_DEPLOY_TOKEN}" ]; then
            echo "ERROR: Add repo secret GHCR_DEPLOY_TOKEN (classic PAT with read:packages) so the server can pull from GHCR."
            exit 1
          fi

          echo "${GHCR_DEPLOY_TOKEN}" | ssh -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "docker login ghcr.io -u ${GHCR_USER} --password-stdin"

          ssh -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -s" <<EOF
          set -euo pipefail
          CONTAINER="${CONTAINER_NAME}"
          IMAGE_REF="${IMAGE_REF}"
          IMAGE_TAG="${IMAGE_TAG}"
          MIN_FREE_MB=800

          echo "=== Disk before pull ==="
          df -h /
          docker system df || true

          avail=\$(df -m / | awk 'NR==2 {print \$4}')
          echo "Free space: \${avail}MB (need >= \${MIN_FREE_MB}MB before docker pull)"
          if [ "\${avail}" -lt "\${MIN_FREE_MB}" ]; then
            echo "ERROR: not enough disk space — free space on the server and re-run deploy."
            exit 1
          fi

          docker pull "\${IMAGE_REF}:\${IMAGE_TAG}"

          docker stop "\${CONTAINER}" 2>/dev/null || true
          docker rename "\${CONTAINER}" "\${CONTAINER}-old" 2>/dev/null || true

          docker run -d \\
            --name "\${CONTAINER}" \\
            --restart unless-stopped \\
            --network mysql-network \\
            --env-file /home/ubuntu/projects/lenra-api/.env \\
            -p 127.0.0.1:4000:4000 \\
            "\${IMAGE_REF}:\${IMAGE_TAG}"

          sleep 5
          curl --fail "http://127.0.0.1:4000/health"

          docker rm -f "\${CONTAINER}-old" 2>/dev/null || true
          docker image prune -af || true
          echo "=== Disk after deploy ==="
          df -h /
          docker system df || true
          EOF
