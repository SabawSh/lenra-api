docker load < /tmp/lenra-api.tar.gz

docker stop lenra-api 2>/dev/null || true

docker rename lenra-api lenra-api-old 2>/dev/null || true

docker run -d \
--name lenra-api \
--restart unless-stopped \
--network mysql-network \
--env-file /home/ubuntu/projects/lenra-api/.env \
-p 127.0.0.1:4000:4000 \
lenra-api:${{ github.sha }}

sleep 5

curl --fail http://127.0.0.1:4000/health

docker rm -f lenra-api-old 2>/dev/null || true

rm -f /tmp/lenra-api.tar.gz

docker image prune -af --filter "until=168h"
