name: Deploy Lenra API

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: lenra-api
  DEPLOY_STAGING_DIR: /home/ubuntu/deploy-staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          if [ ! -f vendor/lenra-content-pipeline/src/difficulty/constants.ts ]; then
            echo "::error::vendor/lenra-content-pipeline missing — run cp from lenra-content-pipeline (see vendor/lenra-content-pipeline/README.md)"
            exit 1
          fi
          docker build -t ${IMAGE_NAME}:${{ github.sha }} .

      - name: Save Docker image
        run: |
          docker save ${IMAGE_NAME}:${{ github.sha }} | gzip -1 > ${IMAGE_NAME}.tar.gz
          ls -lh ${IMAGE_NAME}.tar.gz

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add deploy host to known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Prepare staging directory
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p ${DEPLOY_STAGING_DIR} && df -h ${DEPLOY_STAGING_DIR}"

      - name: Upload image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp -o ServerAliveInterval=15 -o ServerAliveCountMax=120 \
            "${IMAGE_NAME}.tar.gz" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_STAGING_DIR}/${IMAGE_NAME}.tar.gz"

      - name: Deploy on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -s" <<EOF
          set -euo pipefail
          ARCHIVE="${DEPLOY_STAGING_DIR}/${IMAGE_NAME}.tar.gz"
          IMAGE_TAG="${IMAGE_TAG}"
          IMAGE_NAME="${IMAGE_NAME}"

          gunzip -c "\$ARCHIVE" | docker load

          docker stop "\$IMAGE_NAME" 2>/dev/null || true
          docker rename "\$IMAGE_NAME" "\${IMAGE_NAME}-old" 2>/dev/null || true

          docker run -d \\
            --name "\$IMAGE_NAME" \\
            --restart unless-stopped \\
            --network mysql-network \\
            --env-file /home/ubuntu/projects/lenra-api/.env \\
            -p 127.0.0.1:4000:4000 \\
            "\${IMAGE_NAME}:\${IMAGE_TAG}"

          sleep 5
          curl --fail "http://127.0.0.1:4000/health"

          docker rm -f "\${IMAGE_NAME}-old" 2>/dev/null || true
          rm -f "\$ARCHIVE"
          docker image prune -af --filter "until=168h"
          EOF
