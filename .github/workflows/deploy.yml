name: Lenra API CI

# CI runs on push/PR (and optional manual workflow_dispatch re-run).
# Production is NEVER deployed from this workflow automatically.
# VPS manual deploy: ./scripts/deploy.sh — see docs/deploy-manual.md

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Generate route registry (sanity)
        run: npm run generate:routes

  deploy-production:
    name: Production deploy
    needs: ci
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Production is manual on the VPS
        run: |
          echo "::notice title=Manual production deploy::This workflow does not SSH or run Docker on the VPS."
          echo "On the server: cd /home/ubuntu/projects/lenra-api && ./scripts/deploy.sh"
          echo "See docs/deploy-manual.md for rollback and cleanup."
